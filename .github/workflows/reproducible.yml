name: Reproducible build check

# Run by hand before tagging a release (docs/plans/v1.7.md §6.3; docs/fdroid/README.md "Reproducibility"). F-Droid
# ships our signed APK only if its own build of the tag accepts our signature, so the unsigned release build must be
# byte-for-byte the same wherever it is built.
#
# - "twice": builds `ref` unsigned on two clean runners, in different directories, and compares the APKs. Then it
#   signs one with a throwaway key and copies that signature onto the other, as F-Droid will with the real one.
# - "signature": builds the published `release` tag unsigned and copies the signature from that release's APK onto
#   it (apksigcopier, the check F-Droid runs for `Binaries`). Before tagging, this shows the build still reproduces
#   the last release on today's runners; after tagging, run it with the new tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build twice
        default: main
      release:
        description: Published release tag to check the signature against (empty for the latest)
        default: ''

permissions:
  contents: read

env:
  # F-Droid's own tool for the Binaries check (https://pypi.org/project/apksigcopier/).
  APKSIGCOPIER: apksigcopier==1.1.1

jobs:
  resolve:
    name: Resolve ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Both builds must be of the same commit, even if the branch moves between their checkouts.
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" -q .sha)
          echo "$REF is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build in ${{ matrix.dir }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Different checkout paths catch absolute paths leaking into the APK.
        dir: [whirl, elsewhere/whirl-copy]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: ${{ matrix.dir }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # No Gradle cache: each build starts clean, as F-Droid's does.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Build the unsigned release APK
        working-directory: ${{ matrix.dir }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  twice:
    name: Same APK twice
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
      - name: Compare
        run: |
          sha256sum apk-*/app-release-unsigned.apk
          if cmp -s apk-0/app-release-unsigned.apk apk-1/app-release-unsigned.apk; then
            echo "Identical."
            exit 0
          fi
          echo "::error::The two builds differ."
          echo "Entries whose contents differ:"
          for i in 0 1; do (mkdir -p x-$i && cd x-$i && unzip -q ../apk-$i/app-release-unsigned.apk && find . -type f -exec sha256sum {} + | sort -k2 > ../sums-$i.txt); done
          diff sums-0.txt sums-1.txt || true
          # Same contents can still differ in order, timestamps, compression or alignment.
          echo "Zip metadata:"
          for i in 0 1; do zipinfo -v apk-$i/app-release-unsigned.apk > zipinfo-$i.txt; done
          diff zipinfo-0.txt zipinfo-1.txt | head -200 || true
          exit 1
      - name: A signature on one build transplants onto the other
        # The real key never leaves release.yml: sign with a throwaway one, which is enough to show that signing
        # (alignment, v1/v2/v3 blocks) leaves nothing that the other unsigned build lacks.
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -1)
          keytool -genkeypair -keystore throwaway.jks -storepass throwaway -keypass throwaway -alias t \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway -noprompt
          # Keep the zip as Gradle wrote it, as AGP's own signing in release.yml does; apksigner's default re-aligns
          # it, and a signature over a re-aligned zip cannot fit the other, unaligned build.
          "$BT/apksigner" sign --alignment-preserved --ks throwaway.jks --ks-pass pass:throwaway --out signed.apk apk-0/app-release-unsigned.apk
          pipx run "$APKSIGCOPIER" copy signed.apk apk-1/app-release-unsigned.apk transplanted.apk
          "$BT/apksigner" verify --verbose transplanted.apk

  signature:
    name: Signature of ${{ inputs.release || 'the latest release' }} transplants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Which release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          tag="${RELEASE:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Build the unsigned release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # The name release.yml gives it, and the one F-Droid's Binaries URL points at.
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "whirl-$TAG.apk" --dir published
      - name: Copy its signature onto this build and verify
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -1)
          pipx run "$APKSIGCOPIER" copy "published/whirl-$TAG.apk" app/build/outputs/apk/release/app-release-unsigned.apk transplanted.apk
          "$BT/apksigner" verify --verbose transplanted.apk
