name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks, and whether anything but docs changed. Docs-only changes (Markdown, docs/, site/) skip the Gradle
  # jobs; pushes to main always run them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Store listing copies match
        # en-AU is the Play listing; en-US is F-Droid's fallback locale. Edit en-AU and copy it over.
        run: diff -r fastlane/metadata/android/en-AU fastlane/metadata/android/en-US
      - name: Code or docs only
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^docs/|^site/)'; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  assemble:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # The check branch protection requires ("build"): passes when every job above passed, or was skipped for a
  # docs-only change.
  build:
    needs: [changes, lint, test, assemble]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A job ended $r"; exit 1 ;; esac
          done
