name: Release

# The only way a release is published: push a tag vMAJOR.MINOR.PATCH.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  # Google Play's minimum targetSdk for new apps and updates (raised each August).
  PLAY_MIN_TARGET_SDK: 36
  # Play track for each tag's AAB: "alpha" is the built-in closed-testing track (docs/play-console.md).
  PLAY_TRACK: alpha

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          IFS=. read -r major minor patch <<< "$v"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          # The version is committed in app/version.properties (F-Droid builds from it); the tag must agree.
          grep -qx "versionName=$v" app/version.properties || { echo "app/version.properties is not at $v; bump it in the release PR"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0==tag{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          [ -n "$SIGNING_KEYSTORE_B64" ] || { echo "SIGNING_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK + AAB
        env:
          WHIRL_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WHIRL_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          WHIRL_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          WHIRL_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease bundleRelease --stacktrace

      - name: Verify signature and targetSdk
        run: |
          set -o pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E 'Verified using|certificate (DN|SHA-256)'
          target=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdk=$target (Play minimum $PLAY_MIN_TARGET_SDK)"
          [ "$target" -ge "$PLAY_MIN_TARGET_SDK" ]

      - name: Collect artefacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/whirl-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/whirl-${GITHUB_REF_NAME}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          { echo; echo '### SHA-256'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } >> notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == v0.* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Whirl $GITHUB_REF_NAME" --notes-file notes.md $pre

      # Google Play: only once the app exists on Play and the PLAY_SERVICE_ACCOUNT_JSON secret is set (docs/play-console.md
      # §7). The first release on Play is uploaded by hand. Release notes come from fastlane's changelog for this versionCode.
      - name: Play release notes
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "No PLAY_SERVICE_ACCOUNT_JSON secret: skipping Google Play"; exit 0; fi
          notes="fastlane/metadata/android/en-AU/changelogs/${{ steps.version.outputs.code }}.txt"
          [ -s "$notes" ] || { echo "$notes is missing (Play release notes for this version)"; exit 1; }
          mkdir whatsnew && cp "$notes" whatsnew/whatsnew-en-AU
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        # v1.1.5, pinned by commit because this step holds the Play credentials.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: au.howesthat.whirl
          releaseFiles: dist/whirl-${{ github.ref_name }}.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
